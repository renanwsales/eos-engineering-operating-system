name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: eos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: rules-index · links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: RULES-INDEX up to date
        run: python3 scripts/build-rules-index.py --check

      - name: Links and rule refs
        run: python3 scripts/check-links.py

      - name: Playbook domain citations
        run: python3 scripts/check-playbook-refs.py
